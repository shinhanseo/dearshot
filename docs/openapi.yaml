openapi: 3.1.0
info:
  title: DearShot API
  version: 0.5.0-draft
  license:
    name: All rights reserved
    identifier: LicenseRef-Proprietary
  description: |
    Android 앱용 DearShot HTTP API 계약입니다.
    장면 분석 진행 상황은 Server-Sent Events(SSE)로 전달합니다.
    분석 이미지는 Node API의 multipart 업로드로 전달하고 EC2 임시 저장소에서 처리합니다.
    이 파일은 구현 목표 명세입니다. 현재 서버에는 health, guest/google/refresh/logout/me 인증 기반과
    계약에 포함되지 않는 임시 POST /api/v1/scene-analysis mock이 구현되어 있습니다.
servers:
  - url: /api/v1
    description: Same-origin development or deployment
  - url: https://api.dearshot.app/api/v1
    description: Planned production
tags:
  - name: Auth
    description: 게스트, Google, Kakao 인증과 토큰 회전
  - name: User
    description: 회원 정보, 환경 설정, 탈퇴
  - name: Uploads
    description: AI 작업용 임시 이미지 업로드
  - name: Scene analysis
    description: 장면 분석 생성, 조회, SSE 스트리밍
  - name: Photo feedback
    description: 촬영 결과에 대한 비동기 피드백
  - name: Catalog
    description: 장면과 촬영 템플릿 카탈로그
  - name: Interactions
    description: 템플릿 좋아요와 북마크
  - name: App config
    description: 앱 실행 제한값과 운영 설정
  - name: Admin templates
    description: 템플릿 콘텐츠 생성, 버전 관리, 배포

security: []

paths:
  /health:
    get:
      tags: [App config]
      operationId: healthCheck
      summary: 서버 상태 확인
      servers:
        - url: /
          description: Same-origin root
        - url: https://api.dearshot.app
          description: Planned production root
      responses:
        '200':
          description: 서버 정상
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [status, service, database]
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    const: dearshot-api
                  database:
                    type: string
                    const: ready
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: 서비스 점검 또는 일시적 장애
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/guest:
    post:
      tags: [Auth]
      operationId: createGuestSession
      summary: 게스트 토큰 발급
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestAuthRequest'
      responses:
        '201':
          description: 게스트 세션 생성 완료
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/NoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestAuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/google:
    post:
      tags: [Auth]
      operationId: authenticateWithGoogle
      summary: Google ID Token으로 로그인 또는 가입
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
      responses:
        '200':
          description: 로그인 완료
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/NoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberAuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/kakao:
    post:
      tags: [Auth]
      operationId: authenticateWithKakao
      summary: Kakao Access Token으로 로그인 또는 가입
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KakaoAuthRequest'
      responses:
        '200':
          description: 로그인 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberAuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshTokens
      summary: Access Token과 Refresh Token 회전
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 토큰 재발급 완료
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/NoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 현재 Refresh Token 폐기
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: 로그아웃 완료
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              $ref: '#/components/headers/NoCache'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me:
    get:
      tags: [User]
      operationId: getMe
      summary: 내 회원 정보 조회
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 회원 정보
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [User]
      operationId: deleteMe
      summary: 회원 탈퇴 요청
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '202':
          description: 탈퇴 처리 예약
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me/preferences:
    patch:
      tags: [User]
      operationId: updatePreferences
      summary: 사용자 환경 설정 변경
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesRequest'
      responses:
        '200':
          description: 변경된 환경 설정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /uploads:
    post:
      tags: [Uploads]
      operationId: createUpload
      summary: 분석용 임시 이미지 업로드
      description: |
        JPEG 또는 WebP 이미지 하나를 Node API에 직접 전송합니다.
        서버는 전송 크기, part Content-Type, 파일 signature, decode 결과와 해상도를 검증하고
        내부 임시 파일 경로나 URL을 노출하지 않습니다. 성공 응답은 즉시 READY 상태입니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateUploadMultipartRequest'
            encoding:
              purpose:
                contentType: text/plain
              image:
                contentType: image/jpeg, image/webp
      responses:
        '201':
          description: 검증과 임시 저장 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'

  /uploads/{uploadId}:
    delete:
      tags: [Uploads]
      operationId: deleteUpload
      summary: 미사용 임시 업로드 폐기
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '204':
          description: 삭제 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /scene-analyses:
    post:
      tags: [Scene analysis]
      operationId: createSceneAnalysis
      summary: 장면 분석 작업 생성
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSceneAnalysisRequest'
      responses:
        '202':
          description: 분석 작업 접수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSceneAnalysisResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'

  /scene-analyses/{analysisId}:
    get:
      tags: [Scene analysis]
      operationId: getSceneAnalysis
      summary: 장면 분석 상태와 결과 조회
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AnalysisId'
      responses:
        '200':
          description: 분석 상태 또는 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneAnalysis'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Scene analysis]
      operationId: cancelSceneAnalysis
      summary: 장면 분석 취소 또는 결과 폐기
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AnalysisId'
      responses:
        '204':
          description: 취소 또는 삭제 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /scene-analyses/{analysisId}/events:
    get:
      tags: [Scene analysis]
      operationId: streamSceneAnalysisEvents
      summary: 장면 분석 이벤트 SSE 구독
      description: |
        `status`, `clue`, `scene`, `recommendation`, `completed`, `failed` 이벤트를 전송합니다.
        재연결 시 `Last-Event-ID` 헤더를 사용합니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AnalysisId'
        - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          description: SSE 스트림
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-cache
          content:
            text/event-stream:
              schema:
                type: string
              example: |-
                id: 1
                event: clue
                data: {"keyword":"바다","confidence":0.97}

                id: 2
                event: completed
                data: {"analysisId":"ec863a30-d1d8-4285-a043-e1769ee2d7b5"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: 이벤트 보관 기간 만료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /photo-feedbacks:
    post:
      tags: [Photo feedback]
      operationId: createPhotoFeedback
      summary: 촬영 피드백 작업 생성
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePhotoFeedbackRequest'
      responses:
        '202':
          description: 피드백 작업 접수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePhotoFeedbackResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'

  /photo-feedbacks/{feedbackId}:
    get:
      tags: [Photo feedback]
      operationId: getPhotoFeedback
      summary: 촬영 피드백 상태와 결과 조회
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FeedbackId'
      responses:
        '200':
          description: 피드백 상태 또는 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoFeedback'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Photo feedback]
      operationId: cancelPhotoFeedback
      summary: 촬영 피드백 취소 또는 결과 폐기
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FeedbackId'
      responses:
        '204':
          description: 취소 또는 삭제 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /scenes:
    get:
      tags: [Catalog]
      operationId: listScenes
      summary: 지원 장면 카테고리 조회
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: 장면 카탈로그
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /templates:
    get:
      tags: [Catalog]
      operationId: listTemplates
      summary: 촬영 템플릿 목록 조회
      description: Authorization 헤더는 선택 사항이며 회원이면 상호작용 상태를 함께 반환합니다.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: scene
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Locale'
        - name: sort
          in: query
          schema:
            type: string
            enum: [recommended, popular, latest]
            default: recommended
        - name: aspectRatio
          in: query
          schema:
            type: string
            enum: ['4:3', '9:16', '1:1']
        - name: peopleCount
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 템플릿 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatePage'
        '400':
          $ref: '#/components/responses/BadRequest'

  /templates/{templateId}:
    get:
      tags: [Catalog]
      operationId: getTemplate
      summary: 촬영 템플릿 상세 조회
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/Locale'
        - name: version
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 템플릿 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /templates/{templateId}/like:
    put:
      tags: [Interactions]
      operationId: likeTemplate
      summary: 템플릿 좋아요 설정
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200':
          description: 좋아요 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Interactions]
      operationId: unlikeTemplate
      summary: 템플릿 좋아요 해제
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200':
          description: 좋아요 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /templates/{templateId}/bookmark:
    put:
      tags: [Interactions]
      operationId: bookmarkTemplate
      summary: 템플릿 북마크 설정
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200':
          description: 북마크 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarkState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Interactions]
      operationId: unbookmarkTemplate
      summary: 템플릿 북마크 해제
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200':
          description: 북마크 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarkState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/liked-templates:
    get:
      tags: [Interactions]
      operationId: listLikedTemplates
      summary: 좋아요한 템플릿 조회
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 템플릿 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me/bookmarked-templates:
    get:
      tags: [Interactions]
      operationId: listBookmarkedTemplates
      summary: 북마크한 템플릿 조회
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 템플릿 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /app-config:
    get:
      tags: [App config]
      operationId: getAppConfig
      summary: 앱 제한값·정책·기능 플래그 조회
      parameters:
        - name: platform
          in: query
          required: true
          schema:
            type: string
            enum: [android]
        - name: appVersion
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: 앱 설정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
        '400':
          $ref: '#/components/responses/BadRequest'

  /admin/templates:
    post:
      tags: [Admin templates]
      operationId: createTemplateDraft
      summary: 템플릿 초안 생성
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateDraftRequest'
      responses:
        '201':
          description: 템플릿 초안
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/templates/{templateId}:
    patch:
      tags: [Admin templates]
      operationId: updateTemplateDraft
      summary: 템플릿 메타데이터 수정
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTemplateDraftRequest'
      responses:
        '200':
          description: 수정된 템플릿
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/templates/{templateId}/versions:
    post:
      tags: [Admin templates]
      operationId: createTemplateVersion
      summary: 템플릿 콘텐츠 버전 생성
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateVersionRequest'
      responses:
        '201':
          description: 생성된 버전
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/templates/{templateId}/publish:
    post:
      tags: [Admin templates]
      operationId: publishTemplateVersion
      summary: 템플릿 버전 배포
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishTemplateRequest'
      responses:
        '200':
          description: 배포된 템플릿
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTemplate'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/templates/{templateId}/archive:
    post:
      tags: [Admin templates]
      operationId: archiveTemplate
      summary: 템플릿 신규 노출 중단
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200':
          description: 보관된 템플릿
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTemplate'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  headers:
    RequestId:
      description: 요청 추적에 사용하는 UUID. 유효한 클라이언트 값을 유지하거나 서버가 생성한다.
      schema:
        type: string
        format: uuid
    NoStore:
      description: 인증 응답을 공유 또는 로컬 캐시에 저장하지 않도록 지시한다.
      schema:
        type: string
        const: no-store
    NoCache:
      description: 레거시 HTTP 캐시가 인증 응답을 재사용하지 않도록 지시한다.
      schema:
        type: string
        const: no-cache

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 동일 요청의 중복 처리 방지를 위한 UUID
      schema:
        type: string
        format: uuid
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      schema:
        type: string
    Locale:
      name: locale
      in: query
      required: false
      schema:
        type: string
        default: en-US
        pattern: '^[a-z]{2}(-[A-Z]{2})?$'
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AnalysisId:
      name: analysisId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FeedbackId:
      name: feedbackId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'

  responses:
    BadRequest:
      description: 요청 형식 오류
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: 인증 실패
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: 권한 부족
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: 리소스 없음
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: 리소스 상태 충돌
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PayloadTooLarge:
      description: 이미지 크기 제한 초과
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnsupportedMediaType:
      description: 지원하지 않는 multipart 이미지 Content-Type
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unprocessable:
      description: 파일 signature 불일치, decode 실패 또는 해상도 제한 초과
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: 요청 한도 초과
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          schema:
            type: integer
          description: 다시 시도할 수 있는 시간까지의 초
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApiError:
      type: object
      required: [requestId, code, message]
      properties:
        requestId:
          type: string
          format: uuid
        code:
          type: string
          examples: [INVALID_REQUEST]
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    Device:
      type: object
      additionalProperties: false
      required: [installationId, platform, appVersion]
      properties:
        installationId:
          type: string
          format: uuid
        platform:
          type: string
          const: ANDROID
        appVersion:
          type: string

    TokenPair:
      type: object
      required:
        - tokenType
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
      properties:
        tokenType:
          type: string
          const: Bearer
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time

    GuestAuthRequest:
      type: object
      additionalProperties: false
      required: [installationId, locale, appVersion]
      properties:
        installationId:
          type: string
          format: uuid
        locale:
          type: string
        appVersion:
          type: string

    GuestAuthResponse:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [principal, limits]
          properties:
            principal:
              type: object
              required: [id, type]
              properties:
                id:
                  type: string
                  format: uuid
                type:
                  type: string
                  const: GUEST
            limits:
              $ref: '#/components/schemas/RemainingLimits'

    RemainingLimits:
      type: object
      required: [sceneAnalysesRemainingToday, photoFeedbacksRemainingToday]
      properties:
        sceneAnalysesRemainingToday:
          type: integer
          minimum: 0
        photoFeedbacksRemainingToday:
          type: integer
          minimum: 0

    GoogleAuthRequest:
      type: object
      additionalProperties: false
      required: [idToken, nonce, device]
      properties:
        idToken:
          type: string
          minLength: 1
          maxLength: 8192
          description: Android Credential Manager가 반환한 Google ID Token. 서버는 원문을 저장하지 않습니다.
        nonce:
          type: string
          minLength: 16
          maxLength: 256
          description: Credential Manager 요청에 사용한 일회성 난수와 동일한 값
        guestAccessToken:
          type: [string, 'null']
          maxLength: 4096
        device:
          $ref: '#/components/schemas/Device'

    KakaoAuthRequest:
      type: object
      required: [accessToken, device]
      properties:
        accessToken:
          type: string
        guestAccessToken:
          type: [string, 'null']
        device:
          $ref: '#/components/schemas/Device'

    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    MemberAuthResponse:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [isNewUser, user]
          properties:
            isNewUser:
              type: boolean
            user:
              $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, displayName, providers, preferences]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        profileImageUrl:
          type: [string, 'null']
          format: uri
        providers:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [GOOGLE, KAKAO]
        preferences:
          $ref: '#/components/schemas/UserPreferences'
        counts:
          type: object
          properties:
            likedTemplates:
              type: integer
              minimum: 0
            bookmarkedTemplates:
              type: integer
              minimum: 0

    UserPreferences:
      type: object
      required: [locale, defaultAspectRatio, allowLocationContext, aiProcessingConsentVersion]
      properties:
        locale:
          type: string
        defaultAspectRatio:
          type: string
          enum: ['4:3', '9:16', '1:1']
        allowLocationContext:
          type: boolean
        aiProcessingConsentVersion:
          type: string

    UpdatePreferencesRequest:
      type: object
      minProperties: 1
      properties:
        locale:
          type: string
        defaultAspectRatio:
          type: string
          enum: ['4:3', '9:16', '1:1']
        allowLocationContext:
          type: boolean
        aiProcessingConsentVersion:
          type: string

    DeleteAccountRequest:
      type: object
      required: [confirmation]
      properties:
        confirmation:
          type: string
          const: DELETE
        reason:
          type: string
          enum: [NOT_USEFUL, PRIVACY_CONCERN, TOO_EXPENSIVE, OTHER]

    DeleteAccountResponse:
      type: object
      required: [deletionId, scheduledAt]
      properties:
        deletionId:
          type: string
          format: uuid
        scheduledAt:
          type: string
          format: date-time

    CreateUploadMultipartRequest:
      type: object
      required: [purpose, image]
      additionalProperties: false
      properties:
        purpose:
          type: string
          enum: [SCENE_ANALYSIS, PHOTO_FEEDBACK]
        image:
          type: string
          format: binary
          description: JPEG 또는 WebP binary. 최대 크기와 해상도는 AppConfig.upload 정책을 따릅니다.

    UploadResource:
      type: object
      required: [uploadId, status, purpose, contentType, byteSize, width, height, expiresAt]
      additionalProperties: false
      properties:
        uploadId:
          type: string
          format: uuid
        status:
          type: string
          const: READY
        purpose:
          type: string
          enum: [SCENE_ANALYSIS, PHOTO_FEEDBACK]
        contentType:
          type: string
          enum: [image/jpeg, image/webp]
        byteSize:
          type: integer
          minimum: 1
          maximum: 10485760
        width:
          type: integer
          minimum: 1
          maximum: 8192
        height:
          type: integer
          minimum: 1
          maximum: 8192
        expiresAt:
          type: string
          format: date-time

    LocationContext:
      type: object
      required: [latitude, longitude, accuracyMeters]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        accuracyMeters:
          type: number
          minimum: 0

    SceneContext:
      type: object
      properties:
        timezone:
          type: string
        location:
          $ref: '#/components/schemas/LocationContext'

    CreateSceneAnalysisRequest:
      type: object
      required: [uploadId, capturedAt, locale]
      properties:
        uploadId:
          type: string
          format: uuid
        capturedAt:
          type: string
          format: date-time
        locale:
          type: string
        context:
          $ref: '#/components/schemas/SceneContext'

    CreateSceneAnalysisResponse:
      type: object
      required: [analysisId, status, eventsUrl, expiresAt]
      properties:
        analysisId:
          type: string
          format: uuid
        status:
          type: string
          const: QUEUED
        eventsUrl:
          type: string
        expiresAt:
          type: string
          format: date-time

    SceneClue:
      type: object
      required: [keyword, confidence]
      properties:
        keyword:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1

    SceneCandidate:
      type: object
      required: [sceneKey, confidence]
      properties:
        sceneKey:
          type: string
        displayName:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1

    SceneRecommendation:
      type: object
      required: [templateIds, reason]
      properties:
        templateIds:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
        reason:
          type: string

    SceneAnalysis:
      type: object
      required: [analysisId, status, clues, createdAt, expiresAt]
      properties:
        analysisId:
          type: string
          format: uuid
        status:
          type: string
          enum: [QUEUED, PROCESSING, COMPLETED, NEEDS_USER_SELECTION, FAILED, CANCELLED]
        stage:
          type: string
          enum: [PREPROCESSING, DETECTING_SCENE, SELECTING_TEMPLATES]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        clues:
          type: array
          items:
            $ref: '#/components/schemas/SceneClue'
        scene:
          $ref: '#/components/schemas/SceneCandidate'
        sceneCandidates:
          type: array
          items:
            $ref: '#/components/schemas/SceneCandidate'
        recommendation:
          $ref: '#/components/schemas/SceneRecommendation'
        fallback:
          type: object
          properties:
            action:
              type: string
              const: SELECT_SCENE
            suggestedSceneKeys:
              type: array
              items:
                type: string
        failure:
          $ref: '#/components/schemas/JobFailure'
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        expiresAt:
          type: string
          format: date-time

    JobFailure:
      type: object
      required: [code, retryable]
      properties:
        code:
          type: string
        retryable:
          type: boolean

    TemplateReference:
      type: object
      required: [id, version]
      properties:
        id:
          type: string
        version:
          type: integer
          minimum: 1

    CaptureMetadata:
      type: object
      required: [aspectRatio, orientation, guideEnabled]
      properties:
        aspectRatio:
          type: string
          enum: ['4:3', '9:16', '1:1']
        orientation:
          type: string
          enum: [PORTRAIT, LANDSCAPE]
        guideEnabled:
          type: boolean

    CreatePhotoFeedbackRequest:
      type: object
      required: [uploadId, template, capture]
      properties:
        uploadId:
          type: string
          format: uuid
        analysisId:
          type: [string, 'null']
          format: uuid
        template:
          $ref: '#/components/schemas/TemplateReference'
        capture:
          $ref: '#/components/schemas/CaptureMetadata'
        previousFeedbackId:
          type: [string, 'null']
          format: uuid

    CreatePhotoFeedbackResponse:
      type: object
      required: [feedbackId, status, pollAfterMs, expiresAt]
      properties:
        feedbackId:
          type: string
          format: uuid
        status:
          type: string
          const: QUEUED
        pollAfterMs:
          type: integer
          minimum: 250
        expiresAt:
          type: string
          format: date-time

    FeedbackItem:
      type: object
      required: [type, message, action, severity, confidence]
      properties:
        type:
          type: string
          enum: [SUBJECT_POSITION, HORIZON_LEVEL, DISTANCE, HEADROOM, EXPOSURE, BACKGROUND]
        message:
          type: string
        action:
          type: string
          enum: [MOVE_LEFT, MOVE_RIGHT, MOVE_CLOSER, MOVE_BACK, LEVEL_CAMERA, LOWER_CAMERA, RAISE_CAMERA, ADJUST_EXPOSURE]
        severity:
          type: string
          enum: [RECOMMENDED, OPTIONAL]
        confidence:
          type: number
          minimum: 0
          maximum: 1

    FeedbackComparison:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
        improvedFromPrevious:
          type: [boolean, 'null']
        summary:
          type: [string, 'null']

    PhotoFeedback:
      type: object
      required: [feedbackId, status, createdAt, expiresAt]
      properties:
        feedbackId:
          type: string
          format: uuid
        status:
          type: string
          enum: [QUEUED, PROCESSING, COMPLETED, FAILED, CANCELLED]
        pollAfterMs:
          type: integer
        primary:
          $ref: '#/components/schemas/FeedbackItem'
        secondary:
          $ref: '#/components/schemas/FeedbackItem'
        comparison:
          $ref: '#/components/schemas/FeedbackComparison'
        retakeRecommended:
          type: boolean
        failure:
          $ref: '#/components/schemas/JobFailure'
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        expiresAt:
          type: string
          format: date-time

    SceneListItem:
      type: object
      required: [key, displayName, thumbnailUrl, templateCount, active]
      properties:
        key:
          type: string
        displayName:
          type: string
        thumbnailUrl:
          type: string
          format: uri
        templateCount:
          type: integer
          minimum: 0
        active:
          type: boolean

    SceneListResponse:
      type: object
      required: [catalogVersion, items]
      properties:
        catalogVersion:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/SceneListItem'

    TemplateSummary:
      type: object
      required:
        - id
        - version
        - title
        - summary
        - sceneKeys
        - thumbnailUrl
        - previewUrl
        - supportedAspectRatios
        - peopleCount
        - likeCount
        - liked
        - bookmarked
      properties:
        id:
          type: string
        version:
          type: integer
        title:
          type: string
        summary:
          type: string
        sceneKeys:
          type: array
          items:
            type: string
        thumbnailUrl:
          type: string
          format: uri
        previewUrl:
          type: string
          format: uri
        supportedAspectRatios:
          type: array
          items:
            type: string
            enum: ['4:3', '9:16', '1:1']
        peopleCount:
          type: integer
          minimum: 1
        likeCount:
          type: integer
          minimum: 0
        liked:
          type: boolean
        bookmarked:
          type: boolean

    TemplatePage:
      type: object
      required: [catalogVersion, items, nextCursor, hasNext]
      properties:
        catalogVersion:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSummary'
        nextCursor:
          type: [string, 'null']
        hasNext:
          type: boolean

    SafeArea:
      type: object
      required: [left, top, right, bottom]
      properties:
        left:
          type: number
          minimum: 0
          maximum: 1
        top:
          type: number
          minimum: 0
          maximum: 1
        right:
          type: number
          minimum: 0
          maximum: 1
        bottom:
          type: number
          minimum: 0
          maximum: 1

    TemplateGuide:
      type: object
      required: [type, assetUrl, coordinateSpace, referenceWidth, referenceHeight, safeArea]
      properties:
        type:
          type: string
          enum: [SVG_OVERLAY, RASTER_OVERLAY]
        assetUrl:
          type: string
          format: uri
        coordinateSpace:
          type: string
          const: NORMALIZED
        referenceWidth:
          type: integer
        referenceHeight:
          type: integer
        safeArea:
          $ref: '#/components/schemas/SafeArea'

    TemplateInstruction:
      type: object
      required: [order, text]
      properties:
        order:
          type: integer
          minimum: 1
        text:
          type: string

    TemplateDetail:
      allOf:
        - $ref: '#/components/schemas/TemplateSummary'
        - type: object
          required: [guide, instructions, publishedAt]
          properties:
            guide:
              $ref: '#/components/schemas/TemplateGuide'
            instructions:
              type: array
              items:
                $ref: '#/components/schemas/TemplateInstruction'
            publishedAt:
              type: string
              format: date-time

    LikeState:
      type: object
      required: [templateId, liked, likeCount]
      properties:
        templateId:
          type: string
        liked:
          type: boolean
        likeCount:
          type: integer
          minimum: 0

    BookmarkState:
      type: object
      required: [templateId, bookmarked]
      properties:
        templateId:
          type: string
        bookmarked:
          type: boolean

    AppConfig:
      type: object
      required:
        - minimumSupportedVersion
        - latestVersion
        - forceUpdate
        - maintenance
        - catalogVersion
        - upload
        - guestLimits
        - legal
        - features
      properties:
        minimumSupportedVersion:
          type: string
        latestVersion:
          type: string
        forceUpdate:
          type: boolean
        maintenance:
          type: boolean
        catalogVersion:
          type: string
        upload:
          type: object
          required: [maxBytes, supportedContentTypes, recommendedLongEdgePx]
          properties:
            maxBytes:
              type: integer
            supportedContentTypes:
              type: array
              items:
                type: string
            recommendedLongEdgePx:
              type: integer
        guestLimits:
          type: object
          required: [sceneAnalysesPerDay, photoFeedbacksPerDay]
          properties:
            sceneAnalysesPerDay:
              type: integer
            photoFeedbacksPerDay:
              type: integer
        legal:
          type: object
          required: [privacyPolicyVersion, privacyPolicyUrl, termsVersion, termsUrl]
          properties:
            privacyPolicyVersion:
              type: string
            privacyPolicyUrl:
              type: string
              format: uri
            termsVersion:
              type: string
            termsUrl:
              type: string
              format: uri
        features:
          type: object
          additionalProperties:
            type: boolean

    TemplateLocalization:
      type: object
      required: [title, summary]
      properties:
        title:
          type: string
        summary:
          type: string

    CreateTemplateDraftRequest:
      type: object
      required: [id, sceneKeys, peopleCount, supportedAspectRatios, localizations]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        sceneKeys:
          type: array
          minItems: 1
          items:
            type: string
        peopleCount:
          type: integer
          minimum: 1
        supportedAspectRatios:
          type: array
          minItems: 1
          items:
            type: string
            enum: ['4:3', '9:16', '1:1']
        localizations:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: '#/components/schemas/TemplateLocalization'

    UpdateTemplateDraftRequest:
      type: object
      minProperties: 1
      properties:
        sceneKeys:
          type: array
          minItems: 1
          items:
            type: string
        peopleCount:
          type: integer
          minimum: 1
        supportedAspectRatios:
          type: array
          minItems: 1
          items:
            type: string
            enum: ['4:3', '9:16', '1:1']
        localizations:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TemplateLocalization'

    CreateTemplateVersionRequest:
      type: object
      required: [previewUrl, thumbnailUrl, guide, instructions]
      properties:
        previewUrl:
          type: string
          format: uri
        thumbnailUrl:
          type: string
          format: uri
        guide:
          $ref: '#/components/schemas/TemplateGuide'
        instructions:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/TemplateInstruction'

    TemplateVersion:
      type: object
      required: [templateId, version, status, createdAt]
      properties:
        templateId:
          type: string
        version:
          type: integer
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        createdAt:
          type: string
          format: date-time

    PublishTemplateRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
        publishAt:
          type: [string, 'null']
          format: date-time

    AdminTemplate:
      type: object
      required: [id, status, sceneKeys, peopleCount, supportedAspectRatios, createdAt, updatedAt]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        currentVersion:
          type: [integer, 'null']
        sceneKeys:
          type: array
          items:
            type: string
        peopleCount:
          type: integer
        supportedAspectRatios:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
